name: ai_event_scanner
description: "Mobile app for AI Quality Verification Scanner - Event Discovery & Management"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & Networking
  http: ^1.1.0
  dio: ^5.3.0

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Local Storage
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Navigation
  go_router: ^10.0.0

  # Form & Validation
  flutter_form_builder: ^9.0.0
  form_builder_validators: ^10.0.0

  # JSON Serialization
  json_annotation: ^4.8.0
  freezed_annotation: ^2.4.0

  # Logging
  logger: ^2.0.0

  # Date/Time
  intl: ^0.19.0

  # Notifications
  flutter_local_notifications: ^15.0.0
  firebase_messaging: ^14.6.0

  # Firebase
  firebase_core: ^2.20.0
  firebase_analytics: ^10.5.0

  # Error Handling & Monitoring
  sentry_flutter: ^7.8.0

  # UI
  flutter_screenutil: ^5.9.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  animations: ^2.0.0

  # Permissions
  permission_handler: ^11.4.0

  # Device Info
  device_info_plus: ^9.1.0
  package_info_plus: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  freezed: ^2.4.1
  hive_generator: ^2.0.0

  # Testing
  mocktail: ^1.0.0
  integration_test:
    sdk: flutter

  # Linting
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/config/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
