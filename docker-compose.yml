services:
  postgres:
    image: postgres:16-alpine
    container_name: eventshield-postgres
    environment:
      POSTGRES_USER: ai_scanner
      POSTGRES_PASSWORD: your_secure_password
      POSTGRES_DB: ai_event_scanner
    ports:
      - "5432:5432"
    volumes:
      - eventshield_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ai_scanner -d ai_event_scanner"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  eventshield_pg:
